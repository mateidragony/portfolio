name: Test, Generate, and Publish Resume
description: Test resume generators, publish changed PDFs, and persist publication history.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'

    - name: Install LaTeX
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends \
          texlive-latex-base texlive-latex-extra texlive-fonts-recommended

    - name: Install resume dependencies
      shell: bash
      working-directory: extra/resume
      run: python -m pip install -r requirements.txt

    - name: Test resume generators and publisher
      shell: bash
      working-directory: extra/resume
      run: python -m unittest discover -s test -p 'test*.py' -v

    - name: Generate draft resumes
      shell: bash
      working-directory: extra/resume
      run: |
        python gen_html.py
        python gen_latex.py

    - name: Publish changed resume
      shell: bash
      working-directory: extra/resume
      run: python publish_resume.py

    - name: Persist generated resumes and publication history
      shell: bash
      env:
        BRANCH: ${{ github.ref_name }}
      run: |
        git add -A -- \
          extra/resume/html/resume.html \
          extra/resume/latex/resume.tex \
          extra/resume/published-resume.json \
          ':(glob)extra/resume/*.pdf'
        if [[ -d extra/resume/archive ]]; then
          git add -A -- extra/resume/archive
        fi
        if git diff --cached --quiet; then
          echo "No generated resume changes to commit."
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git commit -m "Update published resume [skip ci]"
        git push origin "HEAD:$BRANCH"